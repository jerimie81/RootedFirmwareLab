plugins {
    id 'com.android.library'
}

android {
    namespace 'com.redrum.rootedfirmwarelab.nativeengine'
    compileSdk 35
    ndkVersion "26.1.10909125"

    defaultConfig {
        minSdk 28

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
